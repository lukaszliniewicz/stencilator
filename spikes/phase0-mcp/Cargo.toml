[package]
name = "phase0-mcp"
description = "Phase 0 spike 3: a local stdio MCP server built on the official Rust SDK."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
phase0 = { path = "../phase0" }
rmcp = { version = "=3.12.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
