[package]
name = "stencilator-cli"
description = "The command line for the Stencilator engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "stencilator"
path = "src/main.rs"

[dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
clap = { version = "4.6.10", features = ["derive"] }
rmcp = { version = "=3.12.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
stencilator-core = { workspace = true, features = ["project-schema"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[target.'cfg(unix)'.dependencies]
cap-tempfile = "4.0.3"
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
tempfile = "3.27.0"
winx = "0.36.4"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["io-util", "time"] }

[lints]
workspace = true
