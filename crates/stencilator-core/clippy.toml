# The engine computes only. Input, output, time and randomness from the
# environment belong to the shells (command line, MCP server, browser build).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
doc-valid-idents = ["NumPy", "SplitMix64", "CIELAB", "WebAssembly", ".."]

disallowed-types = [
    { path = "std::fs::File", reason = "the engine never touches the disk; take bytes, return bytes" },
    { path = "std::net::TcpStream", reason = "the engine never uses the network" },
    { path = "std::process::Command", reason = "the engine never starts processes" },
    { path = "std::collections::HashMap", reason = "random iteration order breaks same-input-same-bytes; use BTreeMap or a Vec" },
    { path = "std::collections::HashSet", reason = "random iteration order breaks same-input-same-bytes; use BTreeSet or a Vec" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "the engine never touches the disk" },
    { path = "std::fs::read_to_string", reason = "the engine never touches the disk" },
    { path = "std::fs::write", reason = "the engine never touches the disk" },
    { path = "std::env::var", reason = "settings arrive as arguments, never from the environment" },
    { path = "std::env::var_os", reason = "settings arrive as arguments, never from the environment" },
    { path = "std::time::SystemTime::now", reason = "output must not depend on the clock" },
    { path = "std::time::Instant::now", reason = "output must not depend on the clock" },
    { path = "f64::powf", reason = "platform maths libraries differ in the last bit; use libm so native and browser agree" },
    { path = "f64::powi", reason = "platform maths libraries differ in the last bit; use libm so native and browser agree" },
