[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
license = "MIT"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
stencilator-core = { path = "crates/stencilator-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noise for a small team: names that repeat the module, and attributes the
# compiler would only suggest, not need.
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true

# The browser build trades a little speed for a smaller download.
[profile.wasm]
inherits = "release"
opt-level = "s"
panic = "abort"
